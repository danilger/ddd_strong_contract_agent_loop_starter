schema: spec-driven

context: |
  Пакет client — Vite React FSD v2.1, Playwright UI e2e.
  Агент: только Pi (cwd / projectPath = client/).
  plan.yml наполняется только apply server-change add-to-client-plan-* (append).
  Этот агент plan.yml не пишет.
  Change name (propose): только kebab-case; без underscores.
  Scope текущего change: ## Очередь в project.md (### <slug> 1:1 с plan.yml), когда секция есть.
  Язык: русский.

rules:
  specs:
    - Формат Requirement + Scenario (WHEN/THEN)
    - SHALL/MUST; язык требований: русский
  proposal:
    - "Change name: kebab-case only (^[a-z0-9]+(-[a-z0-9]+)*$); без _"
    - "Обязательная секция ## Affected Files с ### Created и ### Modified"
    - "Пути posix от корня репозитория"
    - "Запрещены правки contract/**, server/**, client/plan.yml (loop tool-lock на ../contract/)"
    - "При client/src/** — e2e/ui/<bc-slug>/*.spec.ts и парный *-test-plan.md в Affected Files"
  tasks:
    - "npm run check из client/ должен быть зелёным"
    - "После правок client/src/** с UI-компонентами: npm run docs:component-tree (без вопросов пользователю)"
    - "При изменении дерева компонентов — client/docs/component-tree.dio в Affected Files"
    - "Прогресс только через openspec/changes (active/archive), не через правки plan.yml"
