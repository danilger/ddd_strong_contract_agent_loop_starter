schema: spec-driven

context: |
  Пакет @repo/contract — HTTP SSOT (Zod + ts-rest).
  Агент: только Pi (cwd / projectPath = contract/).
  План автономен от server/client plan.yml.
  Язык: русский.

rules:
  specs:
    - Формат Requirement + Scenario (WHEN/THEN)
